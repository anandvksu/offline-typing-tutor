name: Build Windows EXE
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --windowed --name "TypingTutor" typing_tutor.py
      - uses: actions/upload-artifact@v4
        with:
          name: TypingTutor-Windows
          path: dist/TypingTutor.exe
